name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Skickas av Cloud Function när publicerat innehåll ändrats
  repository_dispatch:
    types: [content-published]
  # Nattligt skyddsbygge (03:15 UTC)
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Regler, index och Functions deployas bara när koden ändrats (push/manuellt), inte vid varje publicering
  # (content-published) eller nattbygge – de bygger bara om sajten.
  rules:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OKEKEN }}
      - run: npx firebase deploy --only firestore:rules,firestore:indexes,storage,functions --project okeken --non-interactive

  deploy:
    needs: rules
    # rules hoppas över vid publicering/nattbygge; då ska bygget ändå köras
    if: ${{ !cancelled() && (needs.rules.result == 'success' || needs.rules.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Bygget läser publicerade events från Firestore
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OKEKEN }}
      # Starttiden skrivs till meta/build efter deploy (se scripts/write-build-time.mjs)
      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OKEKEN }}
          projectId: okeken
          channelId: live
      - run: node scripts/write-build-time.mjs "${{ steps.started.outputs.at }}"
